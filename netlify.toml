[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://a.ppy.sh https://assets.ppy.sh https://osu.ppy.sh data:; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' https://b.ppy.sh; frame-src https://www.replayviewer.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

